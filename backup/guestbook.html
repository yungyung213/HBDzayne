<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>축하 방명록 - AKSO병원 심장외과</title>
<style>
  :root{
    --mint-600:#1C8C86; --mint-500:#22A199;
    --navy-900:#101826; --navy-800:#1B2A41; --text-dark:#2B3648; --text-muted:#8A93A3;
    --border:#E7EAEE; --bg-app:#F2F4F6;
    --radius-md:16px; --radius-sm:12px;
    --shadow-card:0 4px 20px rgba(25,31,40,0.06);
    --fs-11:11px; --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px; --fs-18:18px; --fs-22:22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-app);}
  html,body,button,input,textarea{
    font-family:"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--text-dark);
  }
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 80px;}
  .back-link{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-13);color:var(--text-muted);text-decoration:none;margin-bottom:18px;}
  .head{text-align:center;margin-bottom:24px;}
  .head .eyebrow{font-size:var(--fs-12);color:var(--mint-600);font-weight:700;letter-spacing:0.5px;margin-bottom:6px;}
  .head h1{font-size:var(--fs-22);margin:0 0 8px;color:var(--navy-900);font-weight:800;}
  .head p{font-size:var(--fs-13);color:var(--text-muted);margin:0;line-height:1.6;}

  .card{background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:20px;margin-bottom:16px;}

  .form-row{margin-bottom:12px;}
  .form-row label{display:block;font-size:var(--fs-12);color:var(--text-muted);margin-bottom:6px;font-weight:600;}
  .form-row input, .form-row textarea{
    width:100%;padding:14px;border:1.5px solid transparent;border-radius:var(--radius-sm);
    font-size:var(--fs-14);font-family:inherit;background:#F2F4F6;resize:vertical;
    transition:border-color .12s, background .12s;
  }
  .form-row input:focus, .form-row textarea:focus{border-color:var(--mint-600);background:#fff;outline:none;}
  .form-row textarea{min-height:90px;line-height:1.5;}
  .char-count{text-align:right;font-size:var(--fs-11);color:var(--text-muted);margin-top:4px;}

  .submit-btn{
    width:100%;padding:14px;border:none;border-radius:var(--radius-sm);
    background:var(--mint-600);color:#fff;font-size:var(--fs-14);font-weight:700;
    cursor:pointer;transition:background .12s, opacity .12s;
  }
  .submit-btn:hover{background:var(--mint-500);}
  .submit-btn:disabled{opacity:0.55;cursor:default;}

  .status-msg{font-size:var(--fs-12);margin-top:10px;text-align:center;min-height:16px;}
  .status-msg.error{color:#D6336C;}
  .status-msg.ok{color:var(--mint-600);}

  .list-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px;}
  .list-head h2{font-size:var(--fs-16);margin:0;color:var(--navy-800);font-weight:800;}
  .list-head .count{font-size:var(--fs-12);color:var(--text-muted);}

  .entry{background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-card);padding:16px 18px;margin-bottom:10px;}
  .entry-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .entry-name{font-size:var(--fs-13);font-weight:700;color:var(--navy-800);}
  .entry-time{font-size:var(--fs-11);color:var(--text-muted);flex:0 0 auto;}
  .entry-msg{font-size:var(--fs-13);line-height:1.6;color:var(--text-dark);white-space:pre-wrap;word-break:break-word;}

  .empty-state{text-align:center;padding:40px 10px;color:var(--text-muted);font-size:var(--fs-13);}
  .loading-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mint-600);margin:0 2px;animation:blink 1.2s infinite ease-in-out;}
  .loading-dot:nth-child(2){animation-delay:.2s;}
  .loading-dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:0.2;}40%{opacity:1;}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="hospital-surprise.html">← 인트라넷으로 돌아가기</a>

  <div class="head">
    <div class="eyebrow">AKSO병원 심장외과</div>
    <h1>🎂 이서언 교수님 생신 축하 방명록</h1>
    <p>9월 5일, 교수님께 전하고 싶은 축하 메시지를 자유롭게 남겨주세요.</p>
  </div>

  <div class="card">
    <div class="form-row">
      <label for="gb-name">닉네임</label>
      <input id="gb-name" type="text" maxlength="20" placeholder="이름 또는 닉네임 (최대 20자)">
    </div>
    <div class="form-row">
      <label for="gb-message">축하 메시지</label>
      <textarea id="gb-message" maxlength="300" placeholder="따뜻한 축하 메시지를 남겨주세요 (최대 300자)"></textarea>
      <div class="char-count"><span id="gb-count">0</span>/300</div>
    </div>
    <button class="submit-btn" id="gb-submit" onclick="submitGuestbook()">방명록 남기기</button>
    <div class="status-msg" id="gb-status"></div>
  </div>

  <div class="list-head">
    <h2>축하 메시지</h2>
    <span class="count" id="gb-total"></span>
  </div>
  <div id="gb-list">
    <div class="empty-state"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>
  </div>
</div>

<script>
/* ⚠️ 아래 URL을 본인의 Apps Script 웹앱 배포 URL로 교체하세요 */
const GUESTBOOK_API_URL = "https://script.google.com/macros/s/AKfycby19RvO8SWYbbrN-z1YILhasAKRZ6q5AvIMR1RonI8zi4NV7ZhWMTw6NSjwHy8JRvNb/exec";

const nameEl = document.getElementById('gb-name');
const msgEl = document.getElementById('gb-message');
const countEl = document.getElementById('gb-count');
const submitBtn = document.getElementById('gb-submit');
const statusEl = document.getElementById('gb-status');
const listEl = document.getElementById('gb-list');
const totalEl = document.getElementById('gb-total');

msgEl.addEventListener('input', () => {
  countEl.textContent = msgEl.value.length;
});

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderEntries(entries){
  totalEl.textContent = entries.length ? `${entries.length}개의 메시지` : '';
  if(!entries.length){
    listEl.innerHTML = '<div class="empty-state">아직 남겨진 메시지가 없어요.<br>가장 먼저 축하 메시지를 남겨보세요!</div>';
    return;
  }
  listEl.innerHTML = entries.map(en => `
    <div class="entry">
      <div class="entry-top">
        <span class="entry-name">${escapeHtml(en.name)}</span>
        <span class="entry-time">${escapeHtml(en.timestamp || '')}</span>
      </div>
      <div class="entry-msg">${escapeHtml(en.message)}</div>
    </div>
  `).join('');
}

async function loadGuestbook(){
  try{
    const res = await fetch(GUESTBOOK_API_URL);
    const data = await res.json();
    if(data.ok) renderEntries(data.entries || []);
  }catch(err){
    listEl.innerHTML = '<div class="empty-state">방명록을 불러오지 못했습니다.<br>잠시 후 새로고침 해주세요.</div>';
  }
}

async function submitGuestbook(){
  const name = nameEl.value.trim();
  const message = msgEl.value.trim();
  statusEl.textContent = '';
  statusEl.className = 'status-msg';

  if(!name || !message){
    statusEl.textContent = '닉네임과 메시지를 모두 입력해주세요.';
    statusEl.classList.add('error');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '남기는 중...';

  try{
    const res = await fetch(GUESTBOOK_API_URL, {
      method: 'POST',
      body: JSON.stringify({ name, message })
    });
    const data = await res.json();
    if(data.ok){
      statusEl.textContent = '축하 메시지가 남겨졌습니다 🎉';
      statusEl.classList.add('ok');
      nameEl.value = '';
      msgEl.value = '';
      countEl.textContent = '0';
      loadGuestbook();
    } else {
      statusEl.textContent = data.error || '전송에 실패했습니다.';
      statusEl.classList.add('error');
    }
  }catch(err){
    statusEl.textContent = '전송 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.';
    statusEl.classList.add('error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '방명록 남기기';
  }
}

loadGuestbook();
setInterval(loadGuestbook, 15000); // 15초마다 새로고침
</script>
</body>
</html>
